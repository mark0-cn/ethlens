<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向中文开发者的 Ethereum 协议会议中英对照阅读器" />
    <title>EthLens · Ethereum 协议会议</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body data-page="archive">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="EthLens 首页">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">EthLens</span>
          <span class="brand-context">协议会议</span>
        </a>

        <nav class="primary-nav" aria-label="主要导航">
          <a class="nav-link active" href="/">会议</a>
          <a class="nav-link" href="https://eips.ethereum.org/" target="_blank" rel="noreferrer">EIP</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换浅色模式" title="切换主题">
            <i data-lucide="sun" aria-hidden="true"></i>
          </button>
          <button class="icon-button mobile-menu-button" id="mobile-menu" type="button" aria-label="打开导航" title="导航">
            <i data-lucide="menu" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="archive-main">
      <section class="archive-heading" aria-labelledby="archive-title">
        <div>
          <span class="section-label">ETHEREUM PROTOCOL CALLS</span>
          <h1 id="archive-title">会议档案</h1>
          <p>按会议类型和日期查找经过中英对照整理的协议讨论。</p>
        </div>
        <div class="archive-count" aria-live="polite"><strong id="meeting-count">--</strong> 场会议</div>
      </section>

      <section class="archive-tools" aria-label="会议筛选">
        <label class="search-field" for="meeting-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="meeting-search" type="search" autocomplete="off" placeholder="搜索会议、编号或关键词" />
        </label>
        <div class="filter-segment" id="series-filter" role="group" aria-label="按会议类型筛选"></div>
      </section>

      <section class="meeting-list" id="meeting-list" aria-label="会议列表">
        <div class="archive-loading">正在读取会议目录</div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="/assets/js/archive.js"></script>
  </body>
</html>
